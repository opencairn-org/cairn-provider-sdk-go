# GitHub release for a v* tag of this library. Workers consume it as a Go
# module (the proxy and sum.golang.org verify the contents), so the release
# carries notes plus a source archive whose checksums are signed keyless with
# cosign, attested by GitHub and described by an SPDX SBOM. Gates: the tag
# must be on main, `make check` must pass, and the exported API is compared
# with the previous tag (gorelease, fleetlint release/api-compatibility/go) —
# a breaking change needs a new major, not a silenced tool. Actions are pinned
# to commit SHAs; Renovate keeps the pins current.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: make check + API compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # gitleaks scans the history; gorelease needs the previous tag
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false              # a publishing build does not read caches other runs wrote
      - name: gitleaks, pinned and checksum-verified
        env:
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          GITLEAKS_VERSION: v8.30.1
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          v=${GITLEAKS_VERSION#v}
          base="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}"
          curl -sSfLO "${base}/gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfL "${base}/gitleaks_${v}_checksums.txt" | grep " gitleaks_${v}_linux_x64.tar.gz$" | sha256sum -c -
          tar -xzf "gitleaks_${v}_linux_x64.tar.gz" -C "$HOME/.local/bin" gitleaks
          rm "gitleaks_${v}_linux_x64.tar.gz"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag not on main"; exit 1; }
      - name: make check
        run: |
          make tools
          export PATH="$(go env GOPATH)/bin:$PATH"
          make check
      - name: API compatibility with the previous release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          base=$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)
          if [ -z "$base" ]; then echo "first release, nothing to compare"; exit 0; fi
          gorelease -base="$base" -version="$TAG"

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    permissions:
      contents: write      # create the release
      id-token: write      # keyless cosign + provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reproducible archive: git archive stamps the commit time, not the clock.
      - name: Source archive and checksums
        env:
          TAG: ${{ github.ref_name }}
          NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --prefix="${NAME}-${TAG#v}/" -o "dist/${NAME}-${TAG}.tar.gz" "$TAG"
          (cd dist && sha256sum ./*.tar.gz > checksums.txt && cat checksums.txt)

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the checksums (keyless)
        env:
          COSIGN_YES: "true"
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/checksums.txt

      - name: SBOM of the module (SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/${{ github.event.repository.name }}-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          v="${TAG#v}"
          # the tag's section without its heading, blank lines around it trimmed
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md \
            | sed -e '1{/^$/d}' -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no '## [$v]' section"; exit 1; }
          cat >> notes.md <<EOF

          ### Use

          ~~~
          go get github.com/opencairn-org/cairn-provider-sdk-go@${TAG}
          ~~~

          The module proxy and sum.golang.org verify the module. The attached source
          archive's checksums are signed keyless with cosign and attested by GitHub
          Actions; the SPDX file is the SBOM of the module. Verify with

          ~~~
          cosign verify-blob --bundle checksums.txt.sigstore.json \\
            --certificate-identity-regexp '^https://github.com/${REPO}/' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
          gh attestation verify checksums.txt --repo ${REPO}
          ~~~
          EOF

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          # shellcheck disable=SC2086  # $pre is an optional flag
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md $pre dist/*
