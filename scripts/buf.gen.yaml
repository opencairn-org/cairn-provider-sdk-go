# buf template used by scripts/sync-proto.sh: the Go message stubs of the
# cairn contract, generated for THIS module's import path. Only
# protoc-gen-go runs — workers speak NATS, not Connect, so no service stubs.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/opencairn-org/cairn-provider-sdk-go/proto
plugins:
  - local: protoc-gen-go
    out: .
    opt:
      - paths=source_relative
